<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Upload</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main class="container mb-lg">
        <sectinon class="content grid-content-center  mb-lg">
            <form action="" class="form file-form pI-md pb-md">
            <h4>FIle Upload</h4>
            <div class="form-row mb-md">
                <label for="name">Name</label>
                <input type="text" id="name" class="form-input" name="name" value="Food">
            </div>

             <div class="form-row mb-md">
                <label for="price">price</label>
                <input type="text" id="price" class="form-input" name="price" value="10.99">
             </div>
             <div class="form-row mb-md">
                <label for="image">Image</label>
                <input type="file" id="image" class="" name="image" accept="image/*">
            </div>
            <button type="submit" class="btn btn-primary mb-md">Add food</button>
        </form>
        </sectinon>
        

        <section class="content grid-content-center  mb-lg">
            <div class="cards mb-lg">
            </div>
        </section>

        
        <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.9.0/axios.min.js"
            integrity="sha512-FPlUpimug7gt7Hn7swE8N2pHw/+oQMq/+R/hH/2hZ43VOQ+Kjh25rQzuLyPz7aUWKlRpI7wXbY6+U3oFPGjPOA=="
            crossorigin="anonymous" referrerpolicy="no-referrer"></script>
        <script src="./browser-app.js"></script>
    </main>
</body>

</html>
